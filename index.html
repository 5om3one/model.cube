<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Model Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #555555;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", monospace;
        }

        /* ИНФОРМАЦИОННАЯ ПАНЕЛЬ СЛЕВА СВЕРХУ */
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        /* МИРОВАЯ СЦЕНА (ВРАЩАЕТСЯ КАМЕРА) */
        .viewport-camera {
            width: 100vw;
            height: 100vh;
            position: absolute;
            perspective: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            /* Камера управляется через transform: rotateX / rotateY */
        }

        /* СТАТИЧНЫЙ МИРОВОЙ КОНТЕЙНЕР КУБА */
        .world-space {
            width: 200px;
            height: 200px;
            position: relative;
            transform-style: preserve-3d;
            /* Куб смещен немного в сторону от идеального центра для ощущения "где-то там" */
            transform: translate3d(20px, -15px, 0); 
        }

        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            transform: rotateX(-15deg) rotateY(25deg); /* Фиксированный начальный угол куба */
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: #aaaaaa;
            border: 1px solid #777777;
            cursor: pointer;
            transition: border 0.1s ease;
        }

        .face-front  { transform: rotateY(  0deg) translateZ(100px); }
        .face-right  { transform: rotateY( 90deg) translateZ(100px); }
        .face-back   { transform: rotateY(180deg) translateZ(100px); }
        .face-left   { transform: rotateY(-90deg) translateZ(100px); }
        .face-top    { transform: rotateX( 90deg) translateZ(100px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(100px); }

        /* Белая обводка при клике на куб */
        .cube.selected .face {
            border: 3px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <div id="infoPanel">
        model: cube.mdl<br>
        type: D<br>
        X: 8 &nbsp; Y: 2 &nbsp; Z: 4<br>
        Xangle: <span id="angX">0</span>°<br>
        Yangle: <span id="angY">0</span>°<br>
        Zangle: <span id="angZ">0</span>°
    </div>

    <!-- ЭКРАН С КАМЕРОЙ, КОТОРАЯ ВРАЩАЕТСЯ ВОКРУГ ЦЕНТРА -->
    <div class="viewport-camera" id="viewport">
        <div class="world-space">
            <div class="cube" id="targetCube">
                <div class="face face-front"></div>
                <div class="face face-back"></div>
                <div class="face face-right"></div>
                <div class="face face-left"></div>
                <div class="face face-top"></div>
                <div class="face face-bottom"></div>
            </div>
        </div>
    </div>

    <script>
        const viewport = document.getElementById('viewport');
        const cube = document.getElementById('targetCube');
        const infoPanel = document.getElementById('infoPanel');
        
        const angXText = document.getElementById('angX');
        const angYText = document.getElementById('angY');
        const angZText = document.getElementById('angZ');

        // Данные модели типа D (скрытая логика вопроса D внутри структуры данных)
        const modelData = {
            model: "cube.mdl",
            type: "D",
            hiddenMeaning: "all and now" // Тот самый вопрос D, привязанный к типу D
        };

        let isDragging = false;
        let startX = 0, startY = 0;
        let camRotX = 0, camRotY = 0;
        let cubeClicked = false;

        // Вращаем камеру при зажатии мыши на экране
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - startX;
            const dy = e.clientY - startY;

            camRotY += dx * 0.5;
            camRotX -= dy * 0.5;
            camRotX = Math.max(-70, Math.min(70, camRotX));

            viewport.style.transform = `rotateX(${camRotX}deg) rotateY(${camRotY}deg)`;

            angXText.innerText = Math.round(camRotX);
            angYText.innerText = Math.round(camRotY % 360);

            startX = e.clientX;
            startY = e.clientY;
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Клик по кубу выделяет его и показывает инфо с типом D
        cube.addEventListener('click', (e) => {
            cubeClicked = true;
            cube.classList.add('selected');
            infoPanel.style.display = 'block';
            console.log("Loaded model type:", modelData.type, "->", modelData.hiddenMeaning);
            e.stopPropagation();
        });

        // Клик в пустоту сбрасывает выбор
        window.addEventListener('click', () => {
            if (!cubeClicked) {
                cube.classList.remove('selected');
                infoPanel.style.display = 'none';
            }
            cubeClicked = false;
        });
    </script>
</body>
</html>
