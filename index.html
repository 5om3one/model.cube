<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Model Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #555555; /* Серый фон сайта */
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", monospace;
        }

        /* ИНФОРМАЦИОННАЯ ПАНЕЛЬ СЛЕВА СВЕРХУ */
        #infoPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none; /* Пропускает клики сквозь себя */
            display: none; /* Скрыто по умолчанию */
            z-index: 100;
        }

        /* 3D СРЕДА (ПЕРСПЕКТИВА И ЦЕНТР ВРАЩЕНИЯ) */
        .scene {
            width: 200px;
            height: 200px;
            perspective: 800px;
        }

        .pivot-point {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg); /* Стартовый поворот */
        }

        /* КУБ И ЕГО ГРАНИ */
        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: #aaaaaa; /* Светло-серый куб */
            border: 1px solid #888888; /* Едва заметные внутренние стыки граней */
            cursor: pointer;
            transition: border 0.1s ease;
        }

        /* Позиционирование 6 граней в 3D пространстве */
        .face-front  { transform: rotateY(  0deg) translateZ(100px); }
        .face-right  { transform: rotateY( 90deg) translateZ(100px); }
        .face-back   { transform: rotateY(180deg) translateZ(100px); }
        .face-left   { transform: rotateY(-90deg) translateZ(100px); }
        .face-top    { transform: rotateX( 90deg) translateZ(100px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(100px); }

        /* Состояние при клике (Белая обводка) */
        .cube.selected .face {
            border: 3px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <!-- ИНФОРМАЦИОННОЕ ТАБЛО -->
    <div id="infoPanel">
        model: cube.mdl<br>
        type: D<br>
        X: 8 &nbsp; Y: 2 &nbsp; Z: 4<br>
        Xangle: <span id="angX">0</span>°<br>
        Yangle: <span id="angY">0</span>°<br>
        Zangle: <span id="angZ">0</span>°
    </div>

    <!-- ТРЕХМЕРНАЯ СЦЕНА -->
    <div class="scene" id="sceneContainer">
        <div class="pivot-point" id="pivot">
            <div class="cube" id="targetCube">
                <div class="face face-front"></div>
                <div class="face face-back"></div>
                <div class="face face-right"></div>
                <div class="face face-left"></div>
                <div class="face face-top"></div>
                <div class="face face-bottom"></div>
            </div>
        </div>
    </div>

    <!-- ЗАКОММЕНТИРОВАННЫЙ ВОПРОС D ДЛЯ АРГ -->
    <!-- D: all and now -->

    <script>
        const pivot = document.getElementById('pivot');
        const cube = document.getElementById('targetCube');
        const infoPanel = document.getElementById('infoPanel');
        
        // Углы отображения в табло
        const angXText = document.getElementById('angX');
        const angYText = document.getElementById('angY');
        const angZText = document.getElementById('angZ');

        // Переменные для вращения куба
        let currentX = -20;
        let currentY = 20;
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let cubeClicked = false;

        // ОБРАБОТКА ВРАЩЕНИЯ С ЛЮБОЙ ТОЧКИ ЭКРАНА
        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMouseX;
            const deltaY = e.clientY - previousMouseY;

            // Изменяем углы поворота вокруг центра экрана
            currentY += deltaX * 0.4;
            currentX -= deltaY * 0.4;

            // Ограничиваем вращение по вертикали, чтобы куб не выворачивался наизнанку
            currentX = Math.max(-85, Math.min(85, currentX));

            // Применяем вращение к центральной точке
            pivot.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            // Обновляем динамические данные углов в инфо-панели
            angXText.innerText = Math.round(currentX);
            angYText.innerText = Math.round(currentY % 360);

            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Поддержка мобильных экранов (тач-события)
        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMouseX = e.touches[0].clientX;
            previousMouseY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousMouseX;
            const deltaY = e.touches[0].clientY - previousMouseY;
            currentY += deltaX * 0.4;
            currentX -= deltaY * 0.4;
            currentX = Math.max(-85, Math.min(85, currentX));
            pivot.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
            angXText.innerText = Math.round(currentX);
            angYText.innerText = Math.round(currentY % 360);
            previousMouseX = e.touches[0].clientX;
            previousMouseY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // ЛОГИКА ВЫДЕЛЕНИЯ КУБА И СБРОСА КЛИКАМ В ПУСТОТУ
        cube.addEventListener('click', (e) => {
            cubeClicked = true;
            cube.classList.add('selected');
            infoPanel.style.display = 'block';
            e.stopPropagation(); // Предотвращает срабатывание клика по окну window
        });

        window.addEventListener('click', () => {
            // Если кликнули не на куб — сбрасываем выделение и скрываем текст
            if (!cubeClicked) {
                cube.classList.remove('selected');
                infoPanel.style.display = 'none';
            }
            cubeClicked = false;
        });
    </script>
</body>
</html>
