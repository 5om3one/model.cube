<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Model Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            background-color: #555555;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Courier New", monospace;
        }

        #infoPanel {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 4px;
            font-size: 14px;
            line-height: 1.5;
            pointer-events: none;
            display: none;
            z-index: 100;
        }

        .scene {
            width: 200px;
            height: 200px;
            perspective: 800px;
        }

        .pivot-point {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transform: rotateX(-20deg) rotateY(20deg);
        }

        .cube {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        .face {
            position: absolute;
            width: 200px;
            height: 200px;
            background: #aaaaaa;
            border: 1px solid #888888;
            cursor: pointer;
            transition: border 0.1s ease;
        }

        .face-front  { transform: rotateY(  0deg) translateZ(100px); }
        .face-right  { transform: rotateY( 90deg) translateZ(100px); }
        .face-back   { transform: rotateY(180deg) translateZ(100px); }
        .face-left   { transform: rotateY(-90deg) translateZ(100px); }
        .face-top    { transform: rotateX( 90deg) translateZ(100px); }
        .face-bottom { transform: rotateX(-90deg) translateZ(100px); }

        .cube.selected .face {
            border: 3px solid #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }
    </style>
</head>
<body>

    <div id="infoPanel">
        model: cube.mdl<br>
        type: D<br>
        X: 8 &nbsp; Y: 2 &nbsp; Z: 4<br>
        Xangle: 0°
        Yangle: 0°
        Zangle: 0°
    </div>

    <div class="scene" id="sceneContainer">
        <div class="pivot-point" id="pivot">
            <div class="cube" id="targetCube">
                <div class="face face-front"></div>
                <div class="face face-back"></div>
                <div class="face face-right"></div>
                <div class="face face-left"></div>
                <div class="face face-top"></div>
                <div class="face face-bottom"></div>
            </div>
        </div>
    </div>

    <!-- all and now -->

    <script>
        const pivot = document.getElementById('pivot');
        const cube = document.getElementById('targetCube');
        const infoPanel = document.getElementById('infoPanel');
        
        let currentX = -20;
        let currentY = 20;
        let isDragging = false;
        let previousMouseX = 0;
        let previousMouseY = 0;
        let cubeClicked = false;

        window.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMouseX;
            const deltaY = e.clientY - previousMouseY;

            currentY += deltaX * 0.4;
            currentX -= deltaY * 0.4;

            currentX = Math.max(-85, Math.min(85, currentX));

            pivot.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;

            angXText.innerText = Math.round(currentX);
            angYText.innerText = Math.round(currentY % 360);

            previousMouseX = e.clientX;
            previousMouseY = e.clientY;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        window.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMouseX = e.touches[0].clientX;
            previousMouseY = e.touches[0].clientY;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const deltaX = e.touches[0].clientX - previousMouseX;
            const deltaY = e.touches[0].clientY - previousMouseY;
            currentY += deltaX * 0.4;
            currentX -= deltaY * 0.4;
            currentX = Math.max(-85, Math.min(85, currentX));
            pivot.style.transform = `rotateX(${currentX}deg) rotateY(${currentY}deg)`;
            angXText.innerText = Math.round(currentX);
            angYText.innerText = Math.round(currentY % 360);
            previousMouseX = e.touches[0].clientX;
            previousMouseY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        cube.addEventListener('click', (e) => {
            cubeClicked = true;
            cube.classList.add('selected');
            infoPanel.style.display = 'block';
            e.stopPropagation();
        });

        window.addEventListener('click', () => {
            if (!cubeClicked) {
                cube.classList.remove('selected');
                infoPanel.style.display = 'none';
            }
            cubeClicked = false;
        });
    </script>
</body>
</html>
